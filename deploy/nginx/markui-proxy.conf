# ============================================================================
# Proxy headers for markui.lk. Install to /etc/nginx/snippets/markui-proxy.conf.
#
# Not /etc/nginx/proxy_params: that is a shared file on this box and other
# sites include it. This one belongs to markui.lk alone.
# ============================================================================

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
# The app's session cookie is Secure in production, and proxy.ts builds the
# /admin/login redirect from the request URL. Get the proto wrong and the
# browser is sent to http://, drops the cookie and loops on the login page.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP         $remote_addr;
# OVERWRITE, never $proxy_add_x_forwarded_for: appending would let a client
# send its own value and have it believed.
proxy_set_header X-Forwarded-For   $remote_addr;

# The App Router streams its responses; buffering them holds the whole render
# back and delays first paint. Request buffering off keeps a 25MB upload from
# being spooled to disk before Next sees any of it.
proxy_buffering off;
proxy_request_buffering off;

proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
