# ============================================================================
# nginx vhost for the Mark UI website — markui.lk (pass 2, with TLS)
# ----------------------------------------------------------------------------
# Installed by deploy/go-live.sh once certbot has issued the certificate. It
# replaces markui.lk-http.conf at the same path, so the swap is atomic from
# nginx's point of view: one `nginx -t`, one reload.
#
# This box serves other sites. Everything here is additive: exact server_names,
# no default_server, no edits to any shared file.
# ============================================================================

# ── Redirect to HTTPS, and keep serving ACME challenges for renewal ─────────
server {
    listen 80;
    listen [::]:80;
    server_name markui.lk www.markui.lk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www -> apex ─────────────────────────────────────────────────────────────
# One canonical hostname. Split out rather than folded into the main block so
# the site never answers on two names and splits its search ranking.
server {
    # Deliberately NO http2 here, on a box we share.
    #
    # On nginx 1.24 (which this is) `http2` is a parameter of the LISTEN
    # SOCKET, not of this server block — so adding it turns HTTP/2 on for every
    # other vhost bound to :443 as well. The sites already here (tableflow,
    # yova, travel-basic, travel-premium, vikkaa) all listen without it.
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.markui.lk;

    ssl_certificate     /etc/letsencrypt/live/markui.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markui.lk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://markui.lk$request_uri;
}

# ── The site ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Exact hostname, and deliberately not default_server: an unmatched host
    # must keep landing wherever it lands today.
    server_name markui.lk;

    ssl_certificate     /etc/letsencrypt/live/markui.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markui.lk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uncomment once HTTPS has held for a day or two. Hard to walk back:
    # browsers remember it for the full max-age.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    include /etc/nginx/snippets/markui-body.conf;
}
