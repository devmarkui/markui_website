# Mark UI — rate-limit zones.
#
# `limit_req_zone` only exists in the http{} context, so this file goes to
# /etc/nginx/conf.d/markui-ratelimit.conf (included by the stock nginx.conf),
# not into the site file.

# Admin sign-in: 5 attempts a minute per IP, with a small burst for the
# favicon/asset requests that ride along with the page.
limit_req_zone $binary_remote_addr zone=markui_login:10m rate=5r/m;

# Everything else: generous, only there to blunt a scraper or a flood.
limit_req_zone $binary_remote_addr zone=markui_general:10m rate=30r/s;
