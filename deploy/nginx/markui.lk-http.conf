# ============================================================================
# nginx vhost for the Mark UI website — markui.lk (pass 1, HTTP only)
# ----------------------------------------------------------------------------
# This box serves other sites. Everything here is additive: an exact
# server_name, no default_server, no edits to any shared file.
#
# This is the file to install FIRST, while markui.lk still resolves to
# ServerByt. It serves the site over plain HTTP and answers ACME challenges.
# It deliberately does NOT redirect to HTTPS: there is no certificate yet, and
# a redirect to a port that cannot complete a handshake is worse than plain
# HTTP.
#
# Once DNS points here and certbot has issued the certificate, deploy/go-live.sh
# swaps this file for markui.lk-https.conf.
#
#   nginx -t && systemctl reload nginx      # reload, NEVER restart
#
# Do NOT use `certbot --nginx` — that plugin rewrites this file. Use the
# webroot method in go-live.sh.
# Do NOT delete /etc/nginx/sites-enabled/default — it may be another site's
# catch-all.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # Exact hostnames, and deliberately not default_server: an unmatched host
    # must keep landing wherever it lands today.
    server_name markui.lk www.markui.lk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/markui-body.conf;
}
