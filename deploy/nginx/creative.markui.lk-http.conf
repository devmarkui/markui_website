# ============================================================================
# nginx vhost for the Creative Vault — creative.markui.lk (pass 1, HTTP only)
# ----------------------------------------------------------------------------
# Safe to install before DNS points here: it only answers for this exact name.
# deploy/go-live-creative.sh issues the certificate once DNS has moved from
# Vercel, then swaps in creative.markui.lk-https.conf.
#
# An exact server_name wins over the regex catch-all in
# subdomains.markui.lk.conf, so the static subdomain sites are unaffected.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name creative.markui.lk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/creative-body.conf;
}
