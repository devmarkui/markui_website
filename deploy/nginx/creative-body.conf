# ============================================================================
# Shared body for the creative.markui.lk vhost (the Creative Vault) — included
# by both creative.markui.lk-http.conf (pass 1) and -https.conf (after
# certbot).
#
# The Vault is the same Next app as markui.lk (port 3005): next.config.ts
# rewrites requests for this host into /vault, so all this vhost has to do is
# pass the Host header through (markui-proxy.conf does) and serve the
# uploaded media straight off disk.
#
# Install to /etc/nginx/snippets/creative-body.conf.
# ============================================================================

# Nothing is uploaded through this host (the dashboard lives on markui.lk).
client_max_body_size 1m;

access_log /var/log/nginx/creative.access.log;
error_log  /var/log/nginx/creative.error.log;

# ── Vault uploads ───────────────────────────────────────────────────────────
# File names are random and never reused, so they can be cached for good.
# A file still on this server's disk is sent from here, with byte ranges
# (Safari needs them for video). One that has moved to the media server
# (media.markui.lk, see lib/media-remote.ts) is handed to the app, which
# streams it from there, Range requests included.
location ~* "^/media/vault/([0-9a-f-]{36}(?:-(?:display|thumb|poster))?\.svg)$" {
    root /srv/markui/data/uploads;
    try_files /vault/$1 @creative_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    # An uploaded SVG opened on its own must not run script on this origin.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
    access_log off;
}

location ~ "^/media/vault/([0-9a-f-]{36}(?:-(?:display|thumb|poster))?\.[a-z0-9]+)$" {
    root /srv/markui/data/uploads;
    try_files /vault/$1 @creative_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

# Any other name under /media/vault/ was never stored.
location /media/vault/ {
    return 404;
}

# The brand mark in the corner of every Vault page, and fonts.
location ~* ^/(brand|fonts)/ {
    root /srv/markui/app/public;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri @creative_app;
}

location /_next/static/ {
    alias /srv/markui/app/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location / {
    limit_req zone=markui_general burst=60 nodelay;

    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}

location @creative_app {
    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}
