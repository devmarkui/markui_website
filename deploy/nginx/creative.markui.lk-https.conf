# ============================================================================
# nginx vhost for the Creative Vault — creative.markui.lk (pass 2, with TLS)
# ----------------------------------------------------------------------------
# Installed by deploy/go-live-creative.sh once certbot has issued the
# certificate, replacing creative.markui.lk-http.conf at the same path.
# Additive only: exact server_name, no default_server, no http2 (see the
# note in markui.lk-https.conf).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name creative.markui.lk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name creative.markui.lk;

    ssl_certificate     /etc/letsencrypt/live/creative.markui.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creative.markui.lk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff font/woff2;

    include /etc/nginx/snippets/creative-body.conf;
}
