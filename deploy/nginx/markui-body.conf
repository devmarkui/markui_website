# ============================================================================
# Shared body for the markui.lk vhost — included by both markui.lk-http.conf
# (pass 1) and markui.lk-https.conf (after certbot), so the two can never
# drift apart.
#
# Install to /etc/nginx/snippets/markui-body.conf. New file, shared with
# nothing else on this box.
# ============================================================================

# Admin uploads are Server Actions with a 25MB limit (next.config.ts). nginx
# defaults to 1m, which turns a project video into a bare nginx 413 the app
# never sees. All three limits have to agree: here, serverActions.bodySizeLimit
# and experimental.proxyClientMaxBodySize.
client_max_body_size 32m;
client_body_timeout 120s;

access_log /var/log/nginx/markui.access.log;
error_log  /var/log/nginx/markui.error.log;

# ── Static files served straight off disk ───────────────────────────────────
# public/ holds ~89MB of hero video. nginx serves those with byte-range support
# — which is what lets the browser scrub and resume — far more cheaply than
# proxying them through Next.
location ~* ^/(hero|brand|fonts|mock|insights)/ {
    root /srv/markui/app/public;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri @markui_app;
}

# Build output: content-hashed filenames, safe to cache forever. No try_files
# fallback here on purpose — nginx resolves try_files against the document root
# rather than the alias, which silently serves the wrong file or nothing. Every
# path under here is a real file the build wrote.
location /_next/static/ {
    alias /srv/markui/app/.next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ── Creative Vault ──────────────────────────────────────────────────────────
# Uploads for the Vault stream to disk through this route (app/api/vault/
# upload), so they can be far larger than the Server Action limit above. Keep
# in step with VAULT_MAX_UPLOAD_MB (default 500) in .env.local.
location = /api/vault/upload {
    client_max_body_size 600m;
    client_body_timeout 600s;

    # markui-proxy.conf turns request buffering off and allows 300s to the
    # app, so the body streams straight through; nginx rejects the timeouts
    # being set a second time here.
    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}

# The dashboard previews Vault uploads on this host too.
# File names are random and never reused, so they can be cached for good.
# A file still on this server's disk is sent from here, with byte ranges
# (Safari needs them for video). One that has moved to the media server
# (media.markui.lk, see lib/media-remote.ts) is handed to the app, which
# streams it from there, Range requests included.
location ~* "^/media/vault/([0-9a-f-]{36}(?:-(?:display|thumb|poster))?\.svg)$" {
    root /srv/markui/data/uploads;
    try_files /vault/$1 @markui_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    # An uploaded SVG opened on its own must not run script on this origin.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
    access_log off;
}

location ~ "^/media/vault/([0-9a-f-]{36}(?:-(?:display|thumb|poster))?\.[a-z0-9]+)$" {
    root /srv/markui/data/uploads;
    try_files /vault/$1 @markui_app;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
}

# Any other name under /media/vault/ was never stored.
location /media/vault/ {
    return 404;
}

# ── Admin sign-in ───────────────────────────────────────────────────────────
location = /admin/login {
    limit_req zone=markui_login burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}

# ── Everything else ─────────────────────────────────────────────────────────
location / {
    limit_req zone=markui_general burst=60 nodelay;

    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}

location @markui_app {
    proxy_pass http://127.0.0.1:3005;
    include /etc/nginx/snippets/markui-proxy.conf;
}
